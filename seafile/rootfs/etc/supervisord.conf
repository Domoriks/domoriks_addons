[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mariadb]
command=/usr/sbin/mysqld --bind-address=127.0.0.1 --port=3306
user=mysql
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/mariadb.log
stderr_logfile=/var/log/supervisor/mariadb.log
priority=10

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.log
priority=20

[program:seafile]
command=/opt/seafile-init.sh
autostart=true
autorestart=true
startsecs=15
stdout_logfile=/var/log/supervisor/seafile.log
stderr_logfile=/var/log/supervisor/seafile.log
priority=30

