name: "Seafile (Self-contained)"
version: "0.1.0"
slug: "seafile"
description: "Seafile CE with bundled MariaDB and Redis for LAN use"
url: "https://github.com/Domoriks/domoriks_addons/tree/main/seafile"
startup: services
boot: auto
init: false
arch:
  - amd64
  - aarch64
docker_api: true
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Seafile HTTP (LAN clients)"
options:
  external_url: "http://homeassistant.local:8000"
  admin_email: "admin@example.com"
  admin_password: "a_very_secure_password_CHANGEME"
schema:
  external_url: str
  admin_email: str
  admin_password: str
